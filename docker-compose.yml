version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    env_file:
      - .env.docker
    # Optional: If you need to connect to a local PostgreSQL instance running on your host machine,
    # you might need to use host.docker.internal in your .env DATABASE_URL instead of localhost.
    extra_hosts:
      - "host.docker.internal:host-gateway"
